<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact – Castore Collection</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Figtree:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="castore.css">
</helmet>
<dc-import name="Header" hint-size="100%,150px" style="position: sticky; top: var(--space-0); z-index: var(--z-header);"></dc-import>
<main class="page">
  <div class="container page-banner">
    <nav class="breadcrumb" aria-label="Breadcrumb"><a class="breadcrumb-link" href="Home.dc.html">Home</a><span class="breadcrumb-sep">/</span><span>Contact</span></nav>
    <h1 class="heading-section">Contact us</h1>
  </div>
  <div class="container section-tight">
    <div class="two-col">
      <div class="two-col-main">
        <div class="form-card">
          <span class="mockup-note">Mockup only · no data is sent</span>
          <h2 class="heading-small">Send us a message</h2>
          <div class="field-row">
            <label class="field"><span class="field-label">Name</span><input class="field-input" type="text"></label>
            <label class="field"><span class="field-label">Phone number</span><input class="field-input" type="tel" placeholder="07XX XXX XXX"></label>
          </div>
          <label class="field"><span class="field-label">Email</span><input class="field-input" type="email"></label>
          <label class="field"><span class="field-label">Message</span><textarea class="field-textarea"></textarea></label>
          <div class="row"><button class="button-primary">Send message</button></div>
        </div>
      </div>
      <aside class="two-col-side">
        <div class="contact-list">
          <a class="contact-item" href="#">
            <span class="icon-circle"><svg class="icon-lg" viewBox="0 0 24 24"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"></path></svg></span>
            <span class="track-text"><span class="contact-item-label">Phone</span><span class="contact-item-value">[PHONE NUMBER]</span></span>
          </a>
          <a class="contact-item" href="#">
            <span class="icon-circle"><svg class="icon-lg" viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"></path></svg></span>
            <span class="track-text"><span class="contact-item-label">WhatsApp</span><span class="contact-item-value">[PHONE / WHATSAPP]</span></span>
          </a>
          <a class="contact-item" href="#">
            <span class="icon-circle"><svg class="icon-lg" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="m3 7 9 6 9-6"></path></svg></span>
            <span class="track-text"><span class="contact-item-label">Email</span><span class="contact-item-value">[EMAIL]</span></span>
          </a>
          <div class="contact-item">
            <span class="icon-circle"><svg class="icon-lg" viewBox="0 0 24 24"><path d="M12 21s-7-6.5-7-12a7 7 0 0 1 14 0c0 5.5-7 12-7 12z"></path><circle cx="12" cy="9" r="2.5"></circle></svg></span>
            <span class="track-text"><span class="contact-item-label">Location</span><span class="contact-item-value">[LOCATION], Kenya</span></span>
          </div>
        </div>
        <div class="category-banner-photo image-placeholder" style="border-radius: var(--radius-xl);"><span class="image-placeholder-label">[Map or store photo]</span></div>
      </aside>
    </div>
  </div>
</main>
<dc-import name="Footer" hint-size="100%,480px"></dc-import>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
