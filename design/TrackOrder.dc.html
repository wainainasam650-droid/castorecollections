<body>
<x-dc>
<helmet>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Track your order – Castore Collection</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Figtree:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="castore.css">
</helmet>
<dc-import name="Header" hint-size="100%,150px" style="position: sticky; top: var(--space-0); z-index: var(--z-header);"></dc-import>
<main class="page">
  <div class="container-narrow section">
    <div class="stack-lg">
      <nav class="breadcrumb" aria-label="Breadcrumb"><a class="breadcrumb-link" href="Home.dc.html">Home</a><span class="breadcrumb-sep">/</span><span>Track your order</span></nav>
      <div class="stack">
        <span class="eyebrow">Where is my parcel?</span>
        <h1 class="heading-section">Track your order</h1>
        <p class="body-text">Enter your order number and the phone number you used at checkout.</p>
      </div>
      <div class="form-card">
        <span class="mockup-note">Mockup only · no data is sent</span>
        <label class="field"><span class="field-label">Order number</span><input class="field-input" type="text" placeholder="e.g. [ORDER NUMBER FORMAT]"></label>
        <label class="field"><span class="field-label">Phone number</span><input class="field-input" type="tel" placeholder="07XX XXX XXX"></label>
        <button class="button-primary button-block">Track order</button>
      </div>
      <a class="whatsapp-link" href="#"><svg class="icon" viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"></path></svg>Can't find your order? Chat with us on WhatsApp</a>
    </div>
  </div>
</main>
<dc-import name="Footer" hint-size="100%,480px"></dc-import>
</x-dc>

class Component extends DCLogic {
